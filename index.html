<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StudyBuddy — your study companion</title>
<meta name="description" content="StudyBuddy is a free study app for school students: notes from any chapter, a Pomodoro focus timer, flashcards, a calculator, an AI doubts bot, a calendar with exam countdown, syllabus tracking and daily tasks. Works offline.">
<meta name="keywords" content="study app, study planner, notes from chapter, pomodoro timer, flashcards, doubts bot, syllabus tracker, exam countdown, student app India, class 6-12">
<meta name="author" content="StudyBuddy">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#5b5bd6">
<link rel="canonical" href="https://swetasuman2131-star.github.io/studybuddy/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="StudyBuddy">
<meta property="og:title" content="StudyBuddy - your study companion">
<meta property="og:description" content="Notes from any chapter, a focus timer, flashcards, a calculator and an AI doubts bot - free and works offline.">
<meta property="og:url" content="https://swetasuman2131-star.github.io/studybuddy/">
<meta property="og:image" content="https://swetasuman2131-star.github.io/studybuddy/icon-512.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="StudyBuddy - your study companion">
<meta name="twitter:description" content="Notes from any chapter, a focus timer, flashcards, a calculator and an AI doubts bot - free and works offline.">
<meta name="twitter:image" content="https://swetasuman2131-star.github.io/studybuddy/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="styles.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "StudyBuddy",
  "applicationCategory": "EducationalApplication",
  "operatingSystem": "Web, Android",
  "url": "https://swetasuman2131-star.github.io/studybuddy/",
  "description": "A free study app for school students: notes from any chapter, a Pomodoro focus timer, flashcards, a calculator, an AI doubts bot, a calendar with exam countdown, syllabus tracking and daily tasks.",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" },
  "featureList": [
    "Notes generated from an uploaded chapter (PDF, Word, text or photo)",
    "Pomodoro focus timer with study tracking",
    "Flashcards with a study mode",
    "Calculator (basic and scientific)",
    "AI doubts bot",
    "Calendar with exam countdown",
    "Syllabus tracker",
    "Daily task management",
    "Works offline"
  ],
  "inLanguage": "en-IN"
}
</script>
</head>
<body>
<header class="appbar">
  <div class="brand">
    <span class="logo">📚</span>
    <span>StudyBuddy<small id="brandDate">—</small></span>
  </div>
  <span class="spacer"></span>
  <button class="iconbtn" id="themeBtn" title="Toggle theme">🌙</button>
  <button class="iconbtn" id="moreBtn" title="More">☰</button>
</header>

<nav class="tabbar" id="tabbar">
  <button data-view="home"><span class="i">🏠</span>Home</button>
  <button data-view="focus"><span class="i">⏱️</span>Focus</button>
  <button data-view="tasks"><span class="i">✅</span>Tasks</button>
  <button data-view="notes"><span class="i">📝</span>Notes</button>
  <button data-view="doubts"><span class="i">🤖</span>Doubts</button>
  <button data-view="calendar" class="desk"><span class="i">📅</span>Calendar</button>
  <button data-view="syllabus" class="desk"><span class="i">📖</span>Syllabus</button>
  <button data-view="progress" class="desk"><span class="i">📊</span>Progress</button>
  <button data-view="cards" class="desk"><span class="i">🃏</span>Cards</button>
  <button data-view="calc" class="desk"><span class="i">🧮</span>Calc</button>
</nav>

<main id="view"></main>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
